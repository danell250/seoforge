services:
  - type: web
    name: seoaxe-api
    env: node
    plan: standard
    buildCommand: npx pnpm@10.33.0 install --frozen-lockfile && npx pnpm@10.33.0 --filter @workspace/api-server run build:prod
    startCommand: cd backend/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
