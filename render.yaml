services:
  - type: web
    name: seoforge-api
    runtime: node
    plan: standard
    buildCommand: "corepack enable && corepack prepare pnpm@10.33.0 --activate && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build:prod"
    startCommand: cd backend/api-server && node --enable-source-maps ./dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_BOOTSTRAP_ADMIN
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: STITCH_EXPRESS_CLIENT_ID
        sync: false
      - key: STITCH_EXPRESS_CLIENT_SECRET
        sync: false
      - key: STITCH_EXPRESS_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_SECRET
        sync: false
      - key: STITCH_EXPRESS_REDIRECT_URL
        value: https://www.seoaxe.site/checkout?payment=return
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGIN
        value: https://www.seoaxe.site
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 30
